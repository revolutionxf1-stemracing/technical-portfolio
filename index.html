<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hydron Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              400: '#D4AF37',
              500: '#C5A028',
              600: '#B08D20'
            },
            black: {
              900: '#000000',
              800: '#111111',
              700: '#1a1a1a'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'] // Good for headers
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap');

    :root {
      --page-width: 420mm;
      --page-height: 297mm;
      --screen-page-width: min(97vw, 1580px);
    }

    html,
    body,
    #root {
      min-height: 100%;
      background: #050505;
    }

    body {
      margin: 0;
    }

    /* A3 Aspect Ratio for display */
    .a3-page {
      aspect-ratio: 420 / 297;
      width: var(--screen-page-width);
      max-width: none;
      margin: 0 auto;
      overflow: hidden;
    }

    @media print {
      html,
      body,
      #root,
      .portfolio-shell {
        background: #000 !important;
      }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .portfolio-shell {
        display: block !important;
        padding: 0 !important;
        gap: 0 !important;
      }

      .a3-page {
        width: var(--page-width) !important;
        min-height: var(--page-height) !important;
        height: var(--page-height) !important;
        aspect-ratio: auto !important;
        margin: 0 !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        break-after: page;
        page-break-after: always;
      }

      .a3-page:last-of-type {
        break-after: auto;
        page-break-after: auto;
      }
    }

    /* Custom scrollbar for aesthetic */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #111;
    }

    ::-webkit-scrollbar-thumb {
      background: #D4AF37;
      border-radius: 4px;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>

</head>

<body class="bg-black-900 text-gray-200">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
